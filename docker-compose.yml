services:
  memento-redact:
    build: .
    image: memento-redact:local
    restart: unless-stopped
    environment:
      MAX_PAYLOAD_SIZE: ${MAX_PAYLOAD_SIZE:-1048576}
      # Host names (besides localhost) you open the UI with, e.g. "redact.example.com,myhost.lan".
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    ports:
      # Bound to localhost: the UI has no login and your rules list your sensitive names.
      # Change to "8080:8080" only behind a reverse proxy with authentication or on a trusted network.
      - "127.0.0.1:8080:8080"
    volumes:
      - memento-data:/app/data
    # The server writes only to the volume, and needs no Linux capabilities.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  memento-data:
