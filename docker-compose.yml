services:
  backend:
    build: .
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - rules-data:/app/config

  frontend:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  rules-data:
